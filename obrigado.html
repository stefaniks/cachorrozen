<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Falta apenas 1 passo · Cachorro ZEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700;1,700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --roxo: #4a2486; --amarelo: #ffb300; --preto: #0e0c12; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 16px;
    font-family: "Inter", system-ui, sans-serif; font-size: 18px; line-height: 1.6; color: #f4f1f8; text-align: center;
    background: var(--preto) radial-gradient(circle at 50% 0%, rgba(74,36,134,.6) 0%, rgba(74,36,134,0) 60%);
  }
  main { max-width: 560px; }
  .passos { display: flex; justify-content: center; gap: 8px; margin-bottom: 22px; }
  .passos span { width: 48px; height: 6px; border-radius: 3px; background: var(--amarelo); }
  .passos span.falta-passo { background: rgba(255,255,255,.2); }
  .etiqueta { color: var(--amarelo); font-size: 13px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
  h1 { font-family: "Cormorant Garamond", Georgia, serif; font-size: clamp(36px, 8vw, 50px); line-height: 1.15; margin: 12px 0 14px; color: #fff; }
  h1 em { color: var(--amarelo); }
  p { color: #d9d2e4; margin: 0 0 28px; }
  .botao {
    display: inline-flex; align-items: center; justify-content: center; gap: 12px; min-height: 64px; padding: 16px 30px;
    background: #1faa59; color: #fff; text-decoration: none; font-weight: 700; font-size: 18px; border-radius: 14px;
    box-shadow: 0 14px 34px rgba(31,170,89,.35);
  }
  .botao svg { width: 26px; height: 26px; }
  footer { margin-top: 40px; color: #8d84a0; font-size: 13px; }
</style>
</head>
<body>
<main>
  <div class="passos" aria-hidden="true"><span></span><span class="falta-passo"></span></div>
  <span class="etiqueta">Cadastro recebido</span>
  <h1>Falta apenas <em>1 passo</em> para concluir a sua inscrição</h1>
  <p>Clique no botão abaixo e entre no grupo de WhatsApp para receber o link da aula.</p>
  <a class="botao" href="https://chat.whatsapp.com/BepydjgOJKfBQpO9KdCMum">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>
    Entrar no grupo do WhatsApp
  </a>
  <footer>© 2026 Cachorro ZEN · Ivete Martins</footer>
</main>
</body>
</html>
